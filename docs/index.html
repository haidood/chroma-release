let activePluginId = "chromacore";
let activeSubView = "overview"; // "overview" or version string e.g. "v2.8.5"

function formatMarkdownBold(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.*?)`/g, '<code style="background:#090b0f;padding:2px 6px;border-radius:4px;border:1px solid #262e3a;color:#6ec3e4;font-family:Consolas,monospace;font-size:12.5px;">$1</code>');
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  let html = "";
  for (const cat of DATA) {
    html += `<div class="cat-header"><span>📁 ${cat.title}</span><span>[${cat.icon}]</span></div>`;
    for (const p of cat.plugins) {
      const isPlugActive = (p.id === activePluginId);
      html += `
        <div class="plugin-group">
          <div class="plugin-row ${isPlugActive ? 'active' : ''}" onclick="selectPlugin('${p.id}', 'overview')">
            <span>${p.name}</span>
            <span class="ver-tag">${p.latest}</span>
          </div>
          <div class="sub-tree ${isPlugActive ? 'open' : ''}">
            <div class="sub-item ${isPlugActive && activeSubView === 'overview' ? 'active' : ''}" onclick="selectPlugin('${p.id}', 'overview')">
              <span>📖 Overview & Plain-English Guide</span>
            </div>
      `;
      for (const v of p.versions) {
        const isVerActive = (isPlugActive && activeSubView === v.version);
        html += `
            <div class="sub-item ${isVerActive ? 'active' : ''}" onclick="selectPlugin('${p.id}', '${v.version}')">
              <span>🏷️ ${v.version} (${v.date})</span>
            </div>
        `;
      }
      html += `</div></div>`;
    }
  }
  sb.innerHTML = html;
}

function findPlugin(pid) {
  for (const cat of DATA) {
    for (const p of cat.plugins) {
      if (p.id === pid) return { cat, plugin: p };
    }
  }
  return null;
}

function selectPlugin(pid, subView) {
  activePluginId = pid;
  activeSubView = subView;
  renderSidebar();
  const found = findPlugin(pid);
  if (!found) return;
  const p = found.plugin;
  const c = document.getElementById("content");

  let html = `
    <div class="hero-box">
      <div class="hero-type">${found.cat.title} // ${p.type}</div>
      <div class="hero-title">
        <span>${p.name}</span>
        <span class="suite-badge">${p.latest}</span>
      </div>
      <div class="hero-summary">${p.summary}</div>
    </div>
  `;

  if (subView === "overview") {
    if (p.versions.length > 0 && p.versions[0].card_image) {
      const imgPath = (window.location.pathname.includes("/docs/")) ? p.versions[0].card_image : ("docs/" + p.versions[0].card_image);
      html += `<img class="release-card-img" src="${imgPath}" alt="${p.name} Release Card">`;
    }

    html += `<div class="section-hdr">📚 Tech-to-Music Translator (Complex Concepts in Plain English)</div>`;
    html += `<div class="glossary-grid">`;
    for (const g of p.glossary) {
      html += `
        <div class="glossary-card">
          <div class="glossary-term">🔹 ${g.term}</div>
          <div class="glossary-simple">${g.simple}</div>
        </div>
      `;
    }
    html += `</div>`;

    html += `<div class="section-hdr">🗂️ All Release Notes & Version History</div>`;
    for (const v of p.versions) {
      html += renderVersionBlock(p, v, false);
    }

    html += `<div class="section-hdr">🛠️ Known Issues & Status</div>`;
    html += `<div class="version-card"><div class="version-card-body"><ul>`;
    for (const ki of p.known_issues) {
      html += `<li>${formatMarkdownBold(ki)}</li>`;
    }
    html += `</ul></div></div>`;
  } else {
    const v = p.versions.find(x => x.version === subView) || p.versions[0];
    html += `<div style="margin-bottom:16px;"><button class="hw-btn" onclick="selectPlugin('${p.id}', 'overview')">⬅ Back to ${p.name} Full Overview & Glossary</button></div>`;
    html += renderVersionBlock(p, v, true);
  }

  c.innerHTML = html;
  c.scrollTop = 0;
}

function renderVersionBlock(p, v, showCardImg) {
  let imgHtml = "";
  if (showCardImg && v.card_image) {
    const imgPath = (window.location.pathname.includes("/docs/")) ? v.card_image : ("docs/" + v.card_image);
    imgHtml = `<img class="release-card-img" src="${imgPath}" alt="${v.version} Release Card">`;
  }
  let items = "";
  for (const hl of v.highlights) {
    items += `<li>${formatMarkdownBold(hl)}</li>`;
  }
  return `
    ${imgHtml}
    <div class="version-card">
      <div class="version-card-hdr">
        <div class="version-card-title">${p.name} <span class="suite-badge" style="margin-left:6px;">${v.version}</span> — ${v.title}</div>
        <div class="version-card-date">Released ${v.date}</div>
      </div>
      <div class="version-card-body">
        <ul>${items}</ul>
        ${ v.hotkeys && v.hotkeys.length > 0 ? `
          <div style="margin-top:16px;">
            <div style="font-size:13.5px;font-weight:700;color:var(--text-platinum);margin-bottom:8px;">⌨️ Sequencer Hotkeys &amp; Gestures Quick Reference:</div>
            <table style="width:100%;border-collapse:collapse;font-size:12.5px;background:#0d1015;border-radius:6px;overflow:hidden;border:1px solid var(--border-gunmetal);">
              <thead>
                <tr style="background:var(--bg-header);color:var(--text-platinum);text-align:left;">
                  <th style="padding:8px 12px;border:1px solid var(--border-gunmetal);">Key / Gesture</th>
                  <th style="padding:8px 12px;border:1px solid var(--border-gunmetal);">Action</th>
                  <th style="padding:8px 12px;border:1px solid var(--border-gunmetal);">Description</th>
                </tr>
              </thead>
              <tbody>
                ${v.hotkeys.map(hk => `<tr><td style="font-family:Consolas,monospace;color:var(--ice-cyan);padding:7px 12px;border:1px solid var(--border-gunmetal);">${hk[0]}</td><td style="font-weight:700;padding:7px 12px;border:1px solid var(--border-gunmetal);">${hk[1]}</td><td style="padding:7px 12px;border:1px solid var(--border-gunmetal);color:var(--text-titanium);">${hk[2]}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>` : '' }
      </div>
    </div>
  `;
}

function showFeedbackPortal() {
  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="hero-box">
      <div class="hero-type">DIAGNOSTICS & TELEMETRY HUB</div>
      <div class="hero-title">1-Click In-Plugin [FEEDBACK] & Bug Report Portal</div>
      <div class="hero-summary">
        When you click the <strong>[ FEEDBACK ]</strong> button in the top-right header of any Chroma plugin, it automatically captures your active synth/effect state, EQ curve, and screenshot, and copies a diagnostic report directly to your Clipboard!
      </div>
    </div>
    <div class="feedback-box">
      <div style="font-weight:700;margin-bottom:6px;">Paste Your Clipboard Diagnostic Report Here (Ctrl+V):</div>
      <textarea id="diagBox" class="diag-input" placeholder="Click [FEEDBACK] inside ChromaCore, then press Ctrl+V here (or paste directly into Discord!)..."></textarea>
      <div style="display:flex;gap:12px;">
        <button class="hw-btn hw-btn-update" onclick="submitToGitHub()">▲ Open Pre-Filled GitHub Issue</button>
        <button class="hw-btn" onclick="selectPlugin('chromacore', 'overview')">⬅ Return to Release Notes</button>
      </div>
    </div>
  `;
}

function submitToGitHub() {
  const body = document.getElementById("diagBox").value || "Paste your diagnostic report here";
  const url = "https://github.com/haidood/chroma-release/issues/new?title=" + encodeURIComponent("[Bug Report] Chroma Audio Suite") + "&body=" + encodeURIComponent(body.substring(0, 1800));
  window.open(url, "_blank");
}

selectPlugin("chromacore", "overview");
</script>
