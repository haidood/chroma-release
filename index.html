<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chroma Audio Suite — Private Preview Access</title>
<style>
  :root {
    --bg: #080b12;
    --panel: #101521;
    --border: #243044;
    --gold: #e8c27c;
    --cyan: #70ccf2;
    --coral: #ff6b6b;
    --text: #eef6fe;
    --muted: #8fa3bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: radial-gradient(circle at 50% 25%, #131c2e 0%, var(--bg) 70%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 30px 28px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
  }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; color: var(--gold); border: 1px solid rgba(232, 194, 124, 0.35);
    background: rgba(232, 194, 124, 0.08); margin-bottom: 14px;
  }
  h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
  .brand-accent { color: var(--cyan); }
  .note { margin: 0 0 22px 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .field-wrap { display: flex; flex-direction: column; gap: 12px; }
  input[type="password"] {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: #070a10; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: var(--cyan); }
  input[type="password"].error { border-color: var(--coral); }
  button {
    width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(232, 194, 124, 0.5);
    background: linear-gradient(180deg, rgba(232, 194, 124, 0.22), rgba(232, 194, 124, 0.10));
    color: var(--gold); font-size: 14px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--gold); background: rgba(232, 194, 124, 0.25); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .status { min-height: 20px; margin-top: 12px; font-size: 12.5px; color: var(--coral); }
  .hint { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
</style>
</head>

  const EXPIRES_ISO = "2026-11-27T05:00:00Z";
  const STORE_KEY = "chroma_portal_pass";

  const form = document.getElementById("unlockForm");
  const pwInput = document.getElementById("pwInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const statusMsg = document.getElementById("statusMsg");

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function isExpired() {
    if (!EXPIRES_ISO) return false;
    const t = Date.parse(EXPIRES_ISO);
    return Number.isFinite(t) && Date.now() > t;
  }

  if (isExpired()) {
    sessionStorage.removeItem(STORE_KEY);
    pwInput.disabled = true;
    unlockBtn.disabled = true;
    statusMsg.textContent = "This Thanksgiving preview pass has expired.";
    return;
  }

  async function tryUnlock(rawPw, isAuto) {
    if (isExpired()) {
      sessionStorage.removeItem(STORE_KEY);
      pwInput.disabled = true;
      unlockBtn.disabled = true;
      statusMsg.textContent = "This Thanksgiving preview pass has expired.";
      return;
    }
    const norm = String(rawPw || "").trim().toUpperCase();
    if (!norm) return;
    pwInput.classList.remove("error");
    statusMsg.textContent = isAuto ? "" : "Decrypting portal...";
    unlockBtn.disabled = true;
    try {
      const enc = new TextEncoder();
      const baseKey = await window.crypto.subtle.importKey(
        "raw", enc.encode(norm), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      const aesKey = await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plainBuf = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(IV_B64) },
        aesKey,
        b64ToBytes(CT_B64)
      );
      const decryptedHtml = new TextDecoder("utf-8").decode(plainBuf);
      sessionStorage.setItem(STORE_KEY, norm);
      document.open();
      document.write(decryptedHtml);
      document.close();
    } catch (err) {
      unlockBtn.disabled = false;
      if (isAuto) {
        sessionStorage.removeItem(STORE_KEY);
        statusMsg.textContent = "";
      } else {
        pwInput.classList.add("error");
        statusMsg.textContent = "Incorrect access phrase \u2014 try again.";
      }
    }
  }

  form.addEventListener("submit", function(ev) {
    ev.preventDefault();
    tryUnlock(pwInput.value, false);
  });

  const saved = sessionStorage.getItem(STORE_KEY);
  if (saved) {
    tryUnlock(saved, true);
  }
})();
